$kind: http-example
request:
  url: "{{baseUrl}}/v2/accounts/:accountId"
  method: GET
  pathVariables:
    accountId: ""
response:
  statusCode: 504
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "upstream_timeout",
          "retryable": true
        }
      }
order: 4000

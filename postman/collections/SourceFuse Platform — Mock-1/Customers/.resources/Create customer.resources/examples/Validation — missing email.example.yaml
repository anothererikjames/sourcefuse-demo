$kind: http-example
request:
  url: "{{baseUrl}}/customers"
  method: POST
response:
  statusCode: 422
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "validation_error",
          "message": "Request failed validation",
          "fields": [
            {
              "field": "email",
              "rule": "required"
            }
          ]
        }
      }
order: 2000

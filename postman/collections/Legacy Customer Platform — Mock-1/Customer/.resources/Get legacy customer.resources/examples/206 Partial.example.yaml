$kind: http-example
request:
  url: "{{baseUrl}}/customers/:externalId"
  method: GET
  pathVariables:
    externalId: ""
response:
  statusCode: 206
  statusText: OK
  headers:
    Content-Type: application/json
    X-Partial-Reason: mainframe-cics-region-degraded
  body:
    type: json
    content: |-
      {
        "externalId": "ext_demo",
        "firstName": "Alex",
        "_partial": true,
        "_missing": [
          "address"
        ]
      }
order: 2000

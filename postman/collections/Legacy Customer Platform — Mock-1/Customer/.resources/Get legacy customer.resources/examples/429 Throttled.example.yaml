$kind: http-example
request:
  url: "{{baseUrl}}/customers/:externalId"
  method: GET
  pathVariables:
    externalId: ""
response:
  statusCode: 429
  statusText: OK
  headers:
    Content-Type: application/json
    Retry-After: "60"
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "legacy_throttled"
        }
      }
order: 4000

$kind: http-example
request:
  url: "{{baseUrl}}/v2/accounts/{{accountId}}"
  method: GET
response:
  statusCode: 429
  statusText: OK
  headers:
    - key: Retry-After
      value: "12"
    - key: X-RateLimit-Remaining
      value: "0"
  body:
    type: raw
    content: |-
      {
        "error": {
          "code": "rate_limited",
          "retryAfterSeconds": 12
        }
      }
    options:
      raw:
        language: json
order: 1000

$kind: http-request
description: Posts a ledger entry against the account.
url: "{{baseUrl}}/v2/accounts/{{accountId}}/ledger"
method: POST
headers:
  Authorization: "Bearer {{authToken}}"
  Content-Type: application/json
body:
  type: raw
  content: |-
    {
      "direction": "credit",
      "amount": "100.00",
      "currency": "USD",
      "memo": "demo"
    }
  options:
    raw:
      language: json
order: 1100
examples: ./.resources/Post ledger entry.resources/examples

name: PR Quality Gate

# Fast (<60s) gate that blocks PR merges if the CI Regression Pipeline collection fails.
# Runs against the Dev environment with the lightweight collection.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-quality-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: API quality gate (Dev)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
          echo "$HOME/.postman/cli/bin" >> $GITHUB_PATH

      - name: Login to Postman
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: postman login --with-api-key "$POSTMAN_API_KEY"

      - name: Run CI Regression Pipeline collection
        run: |
          postman collection run \
            "postman/collections/CI Regression Pipeline" \
            --environment "postman/environments/SourceFuse — Dev.environment.yaml" \
            --reporters cli,junit \
            --reporter-junit-export reports/junit-pr.xml

      - name: Publish results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "reports/junit-pr.xml"
          check_name: API quality gate
          fail_on_failure: true
